<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Abstract refraction of light through layered glass">
  <defs>
    <radialGradient id="orb" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="34%" stop-color="#bcd7ff" stop-opacity=".75"/>
      <stop offset="68%" stop-color="#7aa7e8" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#2b4a7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="55%" stop-color="#cfe2ff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".22"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="#0e1524"/>
  <ellipse cx="330" cy="210" rx="240" ry="200" fill="url(#orb)" filter="url(#soft)"/>
  <g opacity=".9">
    <rect x="70" y="250" width="500" height="150" rx="34" fill="url(#sheet)" stroke="#ffffff" stroke-opacity=".22"/>
    <rect x="110" y="180" width="420" height="120" rx="28" fill="url(#sheet)" stroke="#ffffff" stroke-opacity=".28"/>
    <rect x="160" y="120" width="320" height="90" rx="24" fill="url(#sheet)" stroke="#ffffff" stroke-opacity=".34"/>
  </g>
  <path d="M120 90 L520 60" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
  <circle cx="470" cy="150" r="6" fill="#ffffff" fill-opacity=".8"/>
  <circle cx="180" cy="330" r="4" fill="#ffffff" fill-opacity=".55"/>
</svg>
